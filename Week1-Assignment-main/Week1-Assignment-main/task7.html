<!DOCTYPE html>
<html>
<head>
    <title>Hoverable Sidenav Buttons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .sidenav {
            height: 100%;
            width: 60px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #f1f1f1;
            padding-top: 20px;
        }

        .sidenav a {
            padding: 15px;
            margin-bottom: 5px;
            text-decoration: none;
            color: white;
            display: block;
            text-align: center;
            font-size: 18px;
            transition: 0.3s;
            width: 60px;
        }

        .sidenav a:hover {
            width: 200px;
            color: black;
        }

        .green { background-color: #04AA6D; }
        .blue { background-color: #2196F3; }
        .red { background-color: #f44336; }
        .gray { background-color: #555; }

        .main {
            margin-left: 70px; /* space for sidenav */
            padding: 20px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

<div class="sidenav">
    <a href="#" class="green"></a>
    <a href="#" class="blue"></a>
    <a href="#" class="red"></a>
    <a href="#" class="gray"></a>
</div>

<div class="main">
    <h2>Hoverable Sidenav Buttons</h2>
    <p>Hover over the buttons in the left side navigation to open them.</p>
</div>

</body>
</html>
